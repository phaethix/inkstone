<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春秋战国疆域与兼并 · 前770 — 前221</title>
<style>
:root{
  --bg:#0b0f16;
  --panel:rgba(20,28,40,.78);
  --panel-solid:#141c28;
  --line:rgba(255,255,255,.075);
  --text:#e6edf3;
  --muted:#8b98a8;
  --dim:#5d6b7d;
  --accent:#d4a017;
  --accent2:#e8c25a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(1200px 700px at 18% -12%, #1c2939 0%, transparent 58%),
    radial-gradient(900px 620px at 92% 112%, #19232f 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding:14px 26px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,28,40,.6),rgba(20,28,40,0));
  flex:0 0 auto;
}
header h1{
  margin:0;font-size:20px;font-weight:600;letter-spacing:.06em;
  font-family:"Songti SC","STSong","SimSun",serif;
}
header h1 span{color:var(--accent2)}
header .sub{font-size:12px;color:var(--dim);letter-spacing:.04em}
header .spacer{flex:1}
header .hint{font-size:11.5px;color:var(--dim)}
header .hint kbd{
  display:inline-block;padding:1px 5px;margin:0 2px;border-radius:4px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  font-family:inherit;font-size:10.5px;color:var(--muted);
}
.stage{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr) 342px;
}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{width:100%;height:100%;display:block}
aside{
  border-left:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,25,35,.72),rgba(14,20,28,.9));
  overflow-y:auto;padding:16px 15px 22px;
  display:flex;flex-direction:column;gap:13px;
}
aside::-webkit-scrollbar{width:7px}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.panel{
  border:1px solid var(--line);border-radius:11px;
  background:var(--panel);padding:13px 14px;
}
.panel h3{
  margin:0 0 10px;font-size:11.5px;font-weight:600;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase;
}
.yearpanel{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.era{
  font-size:11px;letter-spacing:.22em;color:var(--accent);
  border:1px solid rgba(212,160,23,.42);border-radius:999px;
  padding:3px 10px;background:rgba(212,160,23,.09);white-space:nowrap;
}
.yearbig{
  font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1;
  font-family:"Songti SC","STSong",serif;
  font-variant-numeric:tabular-nums;
}
.yearnote{margin-top:7px;font-size:11.5px;color:var(--muted);min-height:15px;line-height:1.5}
.power{display:flex;flex-direction:column;gap:7px}
.prow{display:grid;grid-template-columns:14px 44px 1fr 40px;align-items:center;gap:7px;font-size:12px}
.pdot{width:10px;height:10px;border-radius:3px}
.pname{color:var(--text);white-space:nowrap}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;transition:width .5s ease}
.pval{text-align:right;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.events{display:flex;flex-direction:column;gap:8px;max-height:none}
.ev{
  display:grid;grid-template-columns:46px 1fr;gap:9px;
  font-size:12px;line-height:1.62;
  padding:7px 8px;border-radius:8px;
  border-left:2px solid rgba(255,255,255,.09);
  animation:evin .38s ease both;
}
.ev.new{border-left-color:var(--accent);background:rgba(212,160,23,.09)}
.ev time{color:var(--accent2);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.ev p{margin:0;color:#c3ced9}
.ev.tag-merge{border-left-color:#c0392b}
.ev.tag-merge.new{background:rgba(192,57,43,.12)}
.ev.tag-era{border-left-color:#5d8aa8}
@keyframes evin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.empty{font-size:11.5px;color:var(--dim);line-height:1.7}
.controls{
  flex:0 0 auto;padding:12px 26px 16px;
  border-top:1px solid var(--line);
  background:linear-gradient(0deg,rgba(16,22,31,.96),rgba(16,22,31,.55));
}
.crow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.crow+.crow{margin-top:11px}
button{
  font-family:inherit;font-size:12.5px;color:#cfd9e4;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.11);
  border-radius:8px;padding:7px 13px;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s,transform .1s;
  white-space:nowrap;
}
button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
button:active{transform:translateY(1px)}
button.primary{
  background:linear-gradient(180deg,rgba(212,160,23,.26),rgba(212,160,23,.14));
  border-color:rgba(212,160,23,.5);color:#f2d891;min-width:96px;font-weight:600;
}
button.primary:hover{background:linear-gradient(180deg,rgba(212,160,23,.38),rgba(212,160,23,.2))}
.speed{display:flex;gap:0;border:1px solid rgba(255,255,255,.11);border-radius:8px;overflow:hidden}
.speed button{border:0;border-radius:0;padding:6px 10px;font-size:11.5px;background:transparent;color:var(--dim)}
.speed button+button{border-left:1px solid rgba(255,255,255,.08)}
.speed button.on{background:rgba(212,160,23,.2);color:var(--accent2);font-weight:600}
.speed button:hover{background:rgba(255,255,255,.08);color:#fff}
.speed button.on:hover{background:rgba(212,160,23,.28)}
.spacer{flex:1}
.trackwrap{position:relative;width:100%;padding-top:2px}
.evtmarks{position:absolute;left:0;right:0;top:-3px;height:8px;pointer-events:none}
.evtmarks i{
  position:absolute;top:0;width:2px;height:8px;border-radius:1px;
  background:rgba(192,57,43,.55);transform:translateX(-50%);
  transition:background .2s,height .2s;
  pointer-events:auto;cursor:pointer;
}
.evtmarks i:hover{background:#f08a52;height:12px;top:-2px}
.evtmarks i.hit{background:#e0703f;height:11px;top:-1px;box-shadow:0 0 6px rgba(224,112,63,.6)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:5px;border-radius:3px;
  background:linear-gradient(90deg,#3f6f8f 0%,#3f6f8f 53.5%,#7a4a3a 53.5%,#7a4a3a 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,var(--accent2) 55%,#a8790f);
  border:1px solid rgba(0,0,0,.45);margin-top:-5px;
  box-shadow:0 0 10px rgba(212,160,23,.55),0 1px 3px rgba(0,0,0,.6);
}
.ticks{position:relative;height:15px;margin-top:1px}
.ticks span{
  position:absolute;transform:translateX(-50%);
  font-size:10px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.ticks span.major{color:var(--muted)}
.ticks span.era-l{color:#6b93ad}
.ticks span.era-w{color:#a97a63}
.legend{
  position:absolute;left:18px;bottom:14px;
  display:flex;flex-wrap:wrap;gap:4px 11px;max-width:calc(100% - 36px);
  font-size:11px;color:var(--muted);
  padding:9px 12px;border-radius:9px;
  background:rgba(11,15,22,.62);border:1px solid var(--line);
  backdrop-filter:blur(7px);
  transition:opacity .3s;
}
.legend b{display:flex;align-items:center;gap:5px;font-weight:400;color:#b9c5d2}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mapmeta{
  position:absolute;right:18px;top:14px;text-align:right;
  font-size:11px;color:var(--dim);line-height:1.75;pointer-events:none;
}
.mapmeta strong{display:block;font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.tip{
  position:absolute;pointer-events:none;z-index:9;
  min-width:132px;max-width:220px;
  padding:9px 11px;border-radius:9px;
  background:rgba(12,17,25,.94);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 28px rgba(0,0,0,.55);
  font-size:11.5px;line-height:1.6;color:#cdd8e3;
  opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;
}
/* 兼并档案：右下角滑入的卡片，可悬停停留、点击展开当年全部变更 */
.dossier{
  position:absolute;right:16px;bottom:58px;z-index:35;
  width:252px;max-height:min(62vh,430px);
  display:flex;flex-direction:column;
  padding:12px 14px;border-radius:11px;
  background:linear-gradient(180deg,rgba(16,22,31,.97),rgba(10,15,22,.98));
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 18px 44px rgba(0,0,0,.68);
  font-size:11.5px;color:#c3cfdb;line-height:1.62;
  opacity:0;transform:translateY(10px);
  transition:opacity .34s ease,transform .34s cubic-bezier(.2,.7,.3,1);
  pointer-events:none;
}
.dossier.on{opacity:1;transform:none;pointer-events:auto}
.dossier.exp{width:286px;border-color:rgba(232,176,75,.30)}
.ds-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;margin-bottom:9px;padding-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.ds-title{font-size:11px;letter-spacing:.2em;color:#8fa0b3}
.ds-tools{display:flex;align-items:baseline;gap:7px}
.ds-year{font-size:11px;color:#d9b45f;font-variant-numeric:tabular-nums}
.ds-x{
  border:0;background:none;padding:0 0 0 2px;cursor:pointer;
  font-size:13px;line-height:1;color:#5f6c7c;
  transition:color .16s;font-family:inherit;
}
.ds-x:hover{color:#d3dee9}
.ds-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2.5px 0}
.ds-row span:first-child{color:#7d8b9c;flex:0 0 auto;white-space:nowrap}
.ds-row span:last-child{text-align:right;color:#d3dee9;flex:1 1 auto;white-space:nowrap}
.ds-row .nowrap{white-space:nowrap}
.ds-key{color:#e8b04b;font-weight:500}
.ds-sub{color:#6f7d8e;font-style:normal;font-size:10px;margin:0 4px}
.ds-bar{
  height:4px;border-radius:2px;background:rgba(255,255,255,.09);
  margin:7px 0 3px;overflow:hidden;display:flex;
}
.ds-bar i{display:block;height:100%}
.ds-note{
  margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);
  font-size:11px;line-height:1.7;color:#93a1b1;
}
/* 展开按钮与全年变更清单 */
.ds-toggle{
  margin-top:9px;width:100%;padding:5px 0 4px;
  border:1px solid rgba(255,255,255,.10);border-radius:6px;
  background:rgba(255,255,255,.03);cursor:pointer;
  font-size:10.5px;letter-spacing:.06em;color:#8b98a8;
  font-family:inherit;transition:background .18s,color .18s,border-color .18s;
}
.ds-toggle:hover{background:rgba(255,255,255,.07);color:#c9d4e0;border-color:rgba(255,255,255,.18)}
.ds-toggle .arw{display:inline-block;transition:transform .26s ease;margin-left:4px}
.dossier.exp .ds-toggle .arw{transform:rotate(180deg)}
.ds-list{
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .34s cubic-bezier(.2,.7,.3,1),opacity .26s ease,margin-top .3s;
}
.dossier.exp .ds-list{max-height:min(210px,32vh);opacity:1;margin-top:8px;overflow-y:auto}
.ds-list-in{
  padding-top:7px;border-top:1px solid rgba(255,255,255,.07);
}
.ds-li{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:3px 0;font-size:11px;line-height:1.5;
  border-bottom:1px solid rgba(255,255,255,.035);
}
.ds-li:last-child{border-bottom:0}
.ds-li .rg{
  color:#a6b4c4;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ds-li .mv{
  color:#8d9aa9;flex:0 0 auto;display:flex;align-items:center;gap:4px;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.ds-li .mv .dot{
  width:5px;height:5px;border-radius:50%;display:inline-block;
  margin-right:1px;flex:0 0 auto;
}
.ds-li .mv .arw2{color:#4f5c6b;margin:0 1px;font-size:10px}
.ds-empty{font-size:11px;color:#6d7b8c;padding:4px 0}
.dossier.exp{max-height:min(74vh,520px)}
.annex{
  position:absolute;left:50%;top:12%;transform:translate(-50%,-30%);
  text-align:center;pointer-events:none;z-index:40;
  padding:11px 20px;border-radius:11px;
  background:rgba(8,12,18,.90);
  border:1px solid rgba(212,160,23,.28);
  box-shadow:0 16px 44px rgba(0,0,0,.72);
  opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1);
  max-width:min(460px,72%);
}
.annex.on{opacity:1;transform:translate(-50%,-38%)}
.anx-year{
  font-size:11px;letter-spacing:.26em;color:#d9b45f;margin-bottom:8px;
  font-variant-numeric:tabular-nums;
}
.anx-line{
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:"Songti SC","STSong",serif;
}
.anx-con{
  font-size:26px;font-weight:600;letter-spacing:.06em;
  padding:2px 14px;border:1px solid;border-radius:6px;
  background:rgba(9,14,21,.82);text-shadow:0 0 18px currentColor;
}
.anx-verb{
  font-size:15px;color:#c8b48a;letter-spacing:.1em;
}
.anx-vic{
  font-size:24px;font-weight:600;letter-spacing:.06em;
  text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:rgba(255,255,255,.5);
  text-shadow:0 0 14px currentColor;opacity:.9;
}
.anx-detail{
  margin-top:10px;max-width:340px;font-size:11.5px;line-height:1.65;
  color:#b6c2ce;text-shadow:0 1px 6px rgba(0,0,0,.9);
}
.tip h4{margin:0 0 5px;font-size:13.5px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.tip h4 i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.tip .row{color:var(--muted);font-size:11px}
.tip .row b{color:#c9d4df;font-weight:500}
.tip .fate{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.09);color:#a9b6c4}
.region{transition:fill .65s cubic-bezier(.4,0,.2,1),opacity .5s}
.region.pulse{animation:pulseA .95s ease-out}
@keyframes pulseA{
  0%{stroke:rgba(255,255,255,.95);stroke-width:2.4;filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  28%{stroke:rgba(255,255,255,.95);stroke-width:2.4;filter:drop-shadow(0 0 16px rgba(255,255,255,.85))}
  100%{stroke:rgba(255,255,255,.26);stroke-width:1;filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
}
.slabel{
  fill:#fff;text-anchor:middle;dominant-baseline:central;
  pointer-events:none;font-family:"Songti SC","STSong",serif;
  paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:2.4px;stroke-linejoin:round;
  transition:opacity .4s,font-size .4s;
}
.slabel.small{font-size:10px;stroke-width:1.8px;opacity:.9}
@media (max-width:980px){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-left:0;border-top:1px solid var(--line);max-height:230px}
  aside>.panel{min-width:236px}
  header .hint{display:none}
  /* 窄屏：卡片改为视口浮层，避免被地图容器高度限制而截断展开内容 */
  .dossier{
    position:fixed;right:10px;bottom:64px;width:min(252px,calc(100vw - 20px));
    max-height:min(58vh,420px);padding:9px 11px;font-size:11px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .dossier.exp{width:min(286px,calc(100vw - 20px));max-height:min(62vh,440px)}
  /* 窄屏整卡可滚动，清单按内容展开 */
  .dossier.exp .ds-list{max-height:420px;opacity:1;margin-top:8px;overflow:visible}
  /* 窄屏空间紧张：隐藏史实说明，优先保证指标与变更清单完整 */
  .ds-note{display:none}
  .dossier.exp .ds-note{display:none}
}
@media (max-height:680px){
  .dossier{bottom:60px;max-height:min(62vh,400px)}
  .dossier.exp .ds-list{max-height:380px}
}
</style>
</head>
<body>
<header>
  <h1>春秋战国 <span>疆域与兼并</span></h1>
  <div class="sub">公元前 770 年 — 公元前 221 年 · 五百五十年间百余国的消亡</div>
  <div class="spacer"></div>
  <div class="hint"><kbd>空格</kbd>播放 <kbd>←</kbd><kbd>→</kbd>年份 <kbd>D</kbd>兼并档案 <kbd>点击地图</kbd>查看国家</div>
</header>

<div class="stage">
  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet" aria-label="春秋战国疆域图">
      <defs id="defs">
        <radialGradient id="landGrad" cx="42%" cy="38%" r="72%">
          <stop offset="0%" stop-color="#1a2431"/>
          <stop offset="100%" stop-color="#0e1520"/>
        </radialGradient>
        <pattern id="gridPat" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0 L0 0 0 50" fill="none" stroke="rgba(255,255,255,.028)" stroke-width="1"/>
        </pattern>
        <filter id="landGrow" x="-18%" y="-18%" width="136%" height="136%">
          <feMorphology operator="dilate" radius="9" in="SourceGraphic"/>
        </filter>
      </defs>
      <rect x="0" y="0" width="1000" height="720" fill="url(#landGrad)"/>
      <rect x="0" y="0" width="1000" height="720" fill="url(#gridPat)"/>
      <g id="landmass"></g>
      <g id="regions"></g>
      <g id="rivers"></g>
      <g id="conquest"></g>
      <g id="battles"></g>
      <g id="ripples"></g>
      <g id="labels"></g>
    </svg>
    <div class="mapmeta">
      <strong id="metaTitle">天下形势</strong>
      <span id="metaSub">姬姓诸侯 · 百有余国</span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="annex" id="annex"></div>
    <div class="dossier" id="dossier"></div>
    <div class="tip" id="tip"></div>
  </div>

  <aside>
    <div class="panel">
      <div class="yearpanel">
        <div class="yearbig" id="yearBig">前 770 年</div>
        <div class="era" id="eraTag">春秋</div>
      </div>
      <div class="yearnote" id="yearNote">周平王东迁洛邑，王纲解纽，诸侯并起。</div>
    </div>

    <div class="panel">
      <h3>势力版图</h3>
      <div class="power" id="powerList"></div>
    </div>

    <div class="panel">
      <h3>大事记</h3>
      <div class="events" id="eventList">
        <div class="empty">尚未发生任何大事。</div>
      </div>
    </div>
  </aside>
</div>

<div class="controls">
  <div class="crow">
    <button class="primary" id="btnPlay">播放</button>
    <button id="btnPrevEvt">上一事件</button>
    <button id="btnNextEvt">下一事件</button>
    <button id="btnReset">回到前 770 年</button>
    <div class="spacer"></div>
    <span style="font-size:11px;color:var(--dim);letter-spacing:.1em">速度</span>
    <div class="speed" id="speedBox">
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" class="on">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
    </div>
  </div>
  <div class="crow">

/* Catmull-Rom 转三次贝塞尔，让区域边界呈现自然曲线 */
function smoothPath(P, tension = 0.16){
  const n = P.length;
  if (n < 3) return 'M' + P.map(p => p.map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
  let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++){
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6 * tension * 2;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6 * tension * 2;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6 * tension * 2;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6 * tension * 2;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + 'Z';
}

function centroid(pts){
  let a=0,cx=0,cy=0;
  const P = pts.map(p=>px(p[0],p[1]));
  for (let i=0;i<P.length;i++){
    const j=(i+1)%P.length;
    const f = P[i][0]*P[j][1] - P[j][0]*P[i][1];
    a += f; cx += (P[i][0]+P[j][0])*f; cy += (P[i][1]+P[j][1])*f;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-6){
    const s = P.reduce((acc,p)=>[acc[0]+p[0],acc[1]+p[1]],[0,0]);
    return [s[0]/P.length, s[1]/P.length];
  }
  return [cx/(6*a), cy/(6*a)];
}

/* ---------- 渲染某一年的状态 ---------- */
let curYear = null;
let prevOwner = null;

function render(year, opts){
  year = Math.round(year);
  if (year === curYear && !(opts && opts.force)) return;
  const prevYear = curYear;
  curYear = year;
  const own = ownerAt(year);
  const crossedEvent = prevYear === null ? false
    : EVENTS.some(e => e.y > Math.min(prevYear, year) && e.y <= Math.max(prevYear, year));
  // 箭头预算按时间窗重置：同一波动画（950ms 内）共享有限额度，避免多区叠加成乱线
  const nowTs = performance.now();
  if (nowTs - arrowEpoch > 1000){
    arrowEpoch = nowTs;
    arrowBudget = 6;
  }

  // 当年易手中面积最大的一块，作为唯一带箭头的领衔区
  let arrowLeadKey = null;
  if (crossedEvent && prevOwner){
    let bestA = 0;
    for (const r of REGIONS){
      const was = prevOwner[r.k];
      const now = own[r.k];
      if (was === now || now === 'none') continue;
      const a = Math.abs(polyArea(r.p));
      if (a > bestA){ bestA = a; arrowLeadKey = r.k; }
    }
  }

  // 征服者当前已控制的疆域质心（作为无接壤时的退化起点）
  const capCentroid = {};
  for (const k in S){
    if (k === 'none' || !S[k].cap) continue;
    if (own[S[k].cap] === k){
      const rr = REGIONS.find(x => x.k === S[k].cap);
      if (rr) capCentroid[k] = centroid(rr.p);
    }
  }

  // 按势力归集其当前领土（含像素多边形），用于多点进攻的战线计算
  const ownedPolys = {};
  for (const r of REGIONS){
    const o = own[r.k];
    if (o === 'none') continue;
    const poly = r.p.map(p => px(p[0], p[1]));
    (ownedPolys[o] = ownedPolys[o] || []).push({ k: r.k, poly });
  }

  // 为被吞并区计算战线起点：所有接壤的征服者领土，取其边界上离该区最近的点
  function frontOrigins(region, newOwnerKey){
    const target = region.p.map(p => px(p[0], p[1]));
    const origins = [];
    const cands = ownedPolys[newOwnerKey] || [];
    for (const c of cands){
      if (c.k === region.k) continue;
      if (!polygonsTouch(target, c.poly)) continue;
      // 取征服者边界上离被吞并区最近的一段中点，作为这条战线的突破口
      let best = null, bestD = Infinity;
      for (let i = 0; i < c.poly.length; i++){
        const b1 = c.poly[i], b2 = c.poly[(i+1) % c.poly.length];
        const mid = [(b1[0]+b2[0])/2, (b1[1]+b2[1])/2];
        let near = Infinity;
        for (let j = 0; j < target.length; j++){
          const d = distToSegSq(mid, target[j], target[(j+1) % target.length]);
          if (d < near) near = d;
        }
        if (near < bestD){ bestD = near; best = mid; }
      }
      if (best && bestD < 900) origins.push(best); // 30px 以内视为接触面
    }
    if (!origins.length){
      // 无直接接壤（中间隔着缓冲区）：从征服者最近的一块领土出发，仍能看出进攻方向
      let best = null, bestD = Infinity;
      for (const c of cands){
        if (c.k === region.k) continue;
        for (const cp of c.poly){
          for (const tp of target){
            const d = Math.hypot(cp[0]-tp[0], cp[1]-tp[1]);
            if (d < bestD){ bestD = d; best = cp; }
          }
        }
      }
      if (best) origins.push(best);
      else if (capCentroid[newOwnerKey]) origins.push(capCentroid[newOwnerKey]);
    }
    return origins.slice(0, 5); // 最多五路并进，避免视觉过碎
  }

  for (const r of REGIONS){
    const o = own[r.k];
    const el = regionEls[r.k];
    const color = (S[o] || S.none).c;
    const prev = prevOwner ? prevOwner[r.k] : null;
    const changed = prev !== null && prev !== o && o !== 'none';

    if (changed){
      // 底色直接落到新色（被征服潮覆盖，肉眼看到的是潮水推进）
      el.style.transition = 'none';
      el.setAttribute('fill', color);
      el.setAttribute('fill-opacity', '.95');
      if (crossedEvent){
        const origins = frontOrigins(r, o);
        // 只有面积最大的一块易手区保留箭头，避免小区域箭头互相打架
        const isLead = arrowLeadKey && arrowLeadKey === r.k;
        spawnConquestMulti(r, o, origins, { arrows: isLead ? 3 : 0 });
      }
    } else {
      el.style.transition = 'fill .5s ease, fill-opacity .4s ease';
      el.setAttribute('fill', color);
      el.setAttribute('fill-opacity', o === 'none' ? '.34' : '.95');
    }

    // 描边与填充同色：同势力领土自然连成一片，靠色差区分国界
    el.setAttribute('stroke', color);
    el.setAttribute('stroke-width', '4.5');
    el.setAttribute('stroke-opacity', o === 'none' ? '.25' : '.96');
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('stroke-linecap', 'round');
    el.setAttribute('opacity', selectedOwner ? (o === selectedOwner ? '1' : '.28') : '1');
  }

  // 国名标注：优先都城所在区；若都城尚未在手，退而使用该势力当前最大辖区
  const capOf = {}, bigOf = {}, bigArea = {};
  for (const r of REGIONS){
    const o = own[r.k];
    if (o === 'none') continue;
    const a = Math.abs(polyArea(r.p));
    if (!(o in bigArea) || a > bigArea[o]){ bigArea[o] = a; bigOf[o] = r.k; }
  }
  for (const k in S){
    if (!S[k].cap) continue;
    const capKey = S[k].cap;
    capOf[k] = own[capKey] === k ? capKey : (bigOf[k] || null);
  }

  for (const r of REGIONS){
    const o = own[r.k];
    const t = labelEls[r.k];
    const sp = S[o] || S.none;
    const area = Math.abs(polyArea(r.p));

    if (o === 'none'){
      // 无主之地：仅在大区域显示地理名
      if (area > 9000){
        t.textContent = r.n;
        t.setAttribute('font-size', 9.5);
        t.setAttribute('class', 'slabel small');
        t.style.opacity = 0.42;
      } else {
        t.textContent = '';
        t.style.opacity = 0;
      }
      continue;
    }

    if (capOf[o] === r.k){
      t.textContent = sp.n;
      // 小国字号自适应：面积不足时缩小，避免文字溢出区块
      const fs = area < 800 ? 8 : area < 1600 ? 10.5 : (sp.n.length > 2 ? 9.5 : 14);
      t.setAttribute('font-size', fs);
      t.setAttribute('class', 'slabel' + (fs <= 10.5 ? ' small' : ''));
      t.style.opacity = 1;
    } else if (area > 3000){
      t.textContent = r.n;
      t.setAttribute('font-size', 9.5);
      t.setAttribute('class', 'slabel small');
      t.style.opacity = 0.5;
    } else {
      t.textContent = '';
      t.style.opacity = 0;
    }
  }

  prevOwner = own;
  updatePanel(year, own);
  buildLegend(own);
  updateBattles(year);
  highlightEventMarks(year);
  if (prevYear !== null){
    const shownNow = detectAnnexations(prevYear, year);
    if (!shownNow){ clearAnnexBanner(); clearDossier(); }
  }
}

function polyArea(pts){
  const P = pts.map(p=>px(p[0],p[1]));
  let a=0;
  for (let i=0;i<P.length;i++){
    const j=(i+1)%P.length;
    a += P[i][0]*P[j][1] - P[j][0]*P[i][1];
  }
  return a/2;
}

/* ---------- 兼并可视化：多点征服潮 ---------- */
/* 从所有与该区接壤的征服者领土同时发兵，用多个圆形裁剪的并集向被吞并区内部推进，
   直观呈现"几条战线同时压进来"。若无接壤者，退化为从最近邻/征服者质心单点推进。 */
let conquestSeq = 0;

/* 计算点到线段的距离平方 */
function distToSegSq(p, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const len2 = dx*dx + dy*dy;
  if (len2 < 1e-9){
    const ex = p[0]-a[0], ey = p[1]-a[1];
    return ex*ex + ey*ey;
  }
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const qx = a[0] + t*dx, qy = a[1] + t*dy;
  const ex = p[0]-qx, ey = p[1]-qy;
  return ex*ex + ey*ey;
}

/* 判断两个多边形是否接壤：以任一边的端点到对边的最短距离衡量。
   必须用"点到线段"而非"点到点"，否则顶点稀疏时相邻边界会被误判为不相邻。 */
function polygonsTouch(a, b, thresh){
  const ta = (thresh === undefined ? 11 : thresh);
  const t2 = ta * ta;
  for (let i = 0; i < a.length; i++){
    const a1 = a[i], a2 = a[(i+1) % a.length];
    for (let j = 0; j < b.length; j++){
      const b1 = b[j], b2 = b[(j+1) % b.length];
      // 双向检查：a 的端点到 b 的边、b 的端点到 a 的边
      if (distToSegSq(a1, b1, b2) < t2) return true;
      if (distToSegSq(b1, a1, a2) < t2) return true;
    }
  }
  return false;
}

/* 计算从多个起点覆盖本区所需的最大半径 */
function conquestRadius(region, origins){
  let need = 60;
  for (const pt of region.p){
    const [vx, vy] = px(pt[0], pt[1]);
    let near = Infinity;
    for (const o of origins){
      const d = Math.hypot(vx - o[0], vy - o[1]);
      if (Number.isFinite(d)) near = Math.min(near, d);
    }
    if (Number.isFinite(near)) need = Math.max(need, near + 16);
  }
  const area = Math.abs(polyArea(region.p));
  return Math.max(need, Math.sqrt(area / Math.PI) || 60);
}

/* 多点征服潮：origins 为像素坐标起点数组。
   除用圆形裁剪表现潮水推进外，还为部分战线画朝内的箭头，让"几路并进"可数可读。
   箭头受时间窗预算限制（同一波内总量有限），否则统一之年会变成一团乱线。 */
let arrowBudget = 6;
let arrowEpoch = 0;

function spawnConquestMulti(region, newOwnerKey, origins, opts){
  const pts = (origins || []).filter(o => Number.isFinite(o[0]) && Number.isFinite(o[1]));
  if (!pts.length) return;

  const color = (S[newOwnerKey] || S.none).c;
  const radius = conquestRadius(region, pts);
  const id = 'cq' + (++conquestSeq);
  const clip = document.createElementNS(NS, 'clipPath');
  clip.setAttribute('id', id);
  const circles = pts.map(o => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', o[0].toFixed(1));
    c.setAttribute('cy', o[1].toFixed(1));
    c.setAttribute('r', '0');
    clip.appendChild(c);
    return c;
  });
  gDefs.appendChild(clip);

  const wave = document.createElementNS(NS, 'path');
  wave.setAttribute('d', toPath(region.p));
  wave.setAttribute('fill', color);
  wave.setAttribute('clip-path', `url(#${id})`);
  wave.setAttribute('opacity', '.96');
  wave.style.pointerEvents = 'none';
  gConquest.appendChild(wave);

  // 减少动态效果偏好：直接呈现结果，不做推进动画
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm){
    for (const c of circles) c.setAttribute('r', String(radius));
    setTimeout(() => { wave.remove(); clip.remove(); }, 240);
    return;
  }

  // 每条战线的箭头：从起点指向被吞并区质心，数量受时间窗预算约束
  const [rcx, rcy] = centroid(region.p);
  const arrows = [];
  const want = (opts && opts.arrows) || 0;
  const allow = Math.max(0, Math.min(want, pts.length, arrowBudget, 3));
  const arrowPts = pts.slice(0, allow);
  arrowBudget -= arrowPts.length;

  for (const o of arrowPts){
    let dx = rcx - o[0], dy = rcy - o[1];
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const tip = Math.min(len * 0.5, 54);   // 箭头伸入区内的长度
    const x1 = o[0] + dx * 8, y1 = o[1] + dy * 8;
    const x2 = o[0] + dx * tip, y2 = o[1] + dy * tip;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('opacity', '0');
    g.style.pointerEvents = 'none';

    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x1.toFixed(1)); line.setAttribute('y1', y1.toFixed(1));
    line.setAttribute('x2', x2.toFixed(1)); line.setAttribute('y2', y2.toFixed(1));
    line.setAttribute('stroke', '#fff8e2');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-opacity', '.42');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);

    const head = document.createElementNS(NS, 'path');
    const sz = 5.6;
    head.setAttribute('d', `M0,0 L${-sz},${sz*0.46} L${-sz},${-sz*0.46} Z`);
    head.setAttribute('transform', `translate(${x2.toFixed(1)},${y2.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    head.setAttribute('fill', '#fff8e2');
    head.setAttribute('fill-opacity', '.62');
    g.appendChild(head);

    gConquest.appendChild(g);
    arrows.push(g);
  }

  const start = performance.now();
  const dur = 950;
  (function step(t){
    const k = Math.min(1, (t - start) / dur);
    const ease = 1 - Math.pow(1 - k, 2.6);
    const rNow = Math.max(0, radius * ease);
    const val = Number.isFinite(rNow) ? rNow.toFixed(1) : '240';
    for (const c of circles) c.setAttribute('r', val);
    // 箭头在前半程淡入，末段再淡出，避免与最终配色打架
    const fade = k < 0.18 ? k / 0.18 : (k > 0.72 ? Math.max(0, (1 - k) / 0.28) : 1);
    for (const g of arrows) g.setAttribute('opacity', (fade * 0.85).toFixed(3));
    if (k < 1) requestAnimationFrame(step);
    else {
      wave.remove(); clip.remove();
      for (const g of arrows) g.remove();
    }
  })(performance.now());
}

/* ---------- 兼并档案卡片 ---------- */
/* 灭国时在右下角浮出一张小卡片，量化呈现"这一口吃了多少"：
   被灭国原有几块地、一次性归入哪方、征服者此战后领土增长到多少。
   卡片可悬停停留、点击展开查看该年全部易手区域。 */
const DOSSIER_LIFE = 5600;
let lastDossier = null;   // 最近一次档案的入参，供重新打开

function dossierChanges(year){
  const before = ownerAt(year - 1);
  const after = ownerAt(year);
  const list = [];
  for (const r of REGIONS){
    const a = before[r.k];
    const b = after[r.k];
    if (a === b) continue;
    list.push({ k: r.k, n: r.n, from: a, to: b });
  }
  return list;
}

function showDossier(conqKey, victimKey, year, detail, extra){
  const box = $('dossier');
  if (!box) return;
  // 允许传入数组：多家瓜分时按主力（得地最多者）展示量化数据
  const conqs = Array.isArray(conqKey) ? conqKey : [conqKey];
  const vs = S[victimKey];
  if (!vs) return;
  const count0 = (own, k) => Object.values(own).filter(v => v === k).length;
  const _b = ownerAt(year - 1), _a = ownerAt(year);
  const mainKey = conqs.slice().sort((x, y) => count0(_a, y) - count0(_a, x))[0];
  const cs = S[mainKey];
  if (!cs) return;
  const e = extra || {};
  lastDossier = { conqKey, victimKey, year, detail, extra: e };

  const before = _b;
  const after = _a;
  const count = count0;
  const victimBefore = count(before, victimKey);
  const conqBefore = count(before, mainKey);
  const conqAfter = count(after, mainKey);
  const gained = conqAfter - conqBefore;
  const multi = conqs.length > 1;
  const total = REGIONS.length;
  const shareBefore = conqBefore / total * 100;
  const shareAfter = conqAfter / total * 100;

  box.innerHTML = `
    <div class="ds-head">
      <span class="ds-title">兼并档案</span>
      <span class="ds-tools">
        <span class="ds-year">前 ${-year} 年</span>
        <button class="ds-x" id="dsClose" title="关闭（Esc）" aria-label="关闭档案">×</button>
      </span>
    </div>
    <div class="ds-row">
      <span>被灭</span>
      <span style="color:${vs.c}">${vs.n} · 原有 ${victimBefore} 区</span>
    </div>
    <div class="ds-row">
      <span>归入</span>
      <span class="nowrap">${conqs.map(k => {
        const sp = S[k];
        const n = count(after, k) - count(before, k);
        return `<b style="color:${sp.c}">${sp.n}</b>${multi ? `<i class="ds-sub">+${n}区</i>` : ''}`;
      }).join('<i class="ds-sub">·</i>')}</span>
    </div>
    <div class="ds-row">
      <span>疆域变化</span>
      <span>${conqBefore} → <b class="ds-key">${conqAfter}</b> 区（+${gained}）</span>
    </div>
    <div class="ds-row">
      <span>天下占比</span>
      <span>${shareBefore.toFixed(0)}% → <b class="ds-key">${shareAfter.toFixed(0)}%</b></span>
    </div>
    <div class="ds-bar">
      <i style="width:${shareBefore.toFixed(1)}%;background:${cs.c};opacity:.42"></i>
      <i style="width:${Math.max(0, shareAfter - shareBefore).toFixed(1)}%;background:${cs.c}"></i>
    </div>
    ${detail ? `<div class="ds-note">${detail}</div>` : ''}
    <button class="ds-toggle" id="dsToggle" aria-expanded="false">当年全部变更<span class="arw">⌄</span></button>
    <div class="ds-list" id="dsList"></div>`;

  const list = dossierChanges(year);
  const listBox = box.querySelector('#dsList');
  listBox.innerHTML = list.length
    ? `<div class="ds-list-in">${list.map(c => {
        const fs = S[c.from] || S.none, ts = S[c.to] || S.none;
        return `<div class="ds-li">
          <span class="rg">${c.n}</span>
          <span class="mv">
            <i class="dot" style="background:${fs.c}"></i>${fs.n}
            <span class="arw2">→</span>
            <i class="dot" style="background:${ts.c}"></i>${ts.n}
          </span>
        </div>`;
      }).join('')}</div>`
    : '<div class="ds-empty">本年无区域易手</div>';

  box.classList.remove('on', 'exp');
  clearTimeout(box._hide);
  void box.getBoundingClientRect().width;
  requestAnimationFrame(() => box.classList.add('on'));

  // 展开/收起当年变更清单
  box.querySelector('#dsToggle').addEventListener('click', ev => {
    ev.stopPropagation();
    const on = box.classList.toggle('exp');
    box.querySelector('#dsToggle').setAttribute('aria-expanded', on ? 'true' : 'false');
    clearTimeout(box._hide); // 展开后不再自动关闭
  });
  box.querySelector('#dsClose').addEventListener('click', ev => {
    ev.stopPropagation();
    clearDossier();
  });

  // 悬停期间暂停自动关闭，移开后重新计时
  box.onmouseenter = () => clearTimeout(box._hide);
  box.onmouseleave = () => {
    clearTimeout(box._hide);
    box._hide = setTimeout(() => { if (!box.classList.contains('exp')) box.classList.remove('on'); }, 1400);
  };

  box._hide = setTimeout(() => {
    if (!box.classList.contains('exp')) box.classList.remove('on');
  }, DOSSIER_LIFE);
}

function clearDossier(){
  const box = $('dossier');
  if (!box) return;
  clearTimeout(box._hide);
  box.onmouseenter = box.onmouseleave = null;
  box.classList.remove('on', 'exp');
  box.innerHTML = '';
}

/* 展示当前年份之前最近一次兼并的档案（保证与地图所示年份一致） */
function reopenDossier(){
  // 当前年份正好有档案，直接重开
  if (lastDossier && lastDossier.year === curYear){
    showDossier(lastDossier.conqKey, lastDossier.victimKey, lastDossier.year, lastDossier.detail, lastDossier.extra);
    return true;
  }
  // 否则向前回溯，找最近一次造成灭国的兼并
  const merges = EVENTS.filter(e => e.t === 'merge' && e.ch && e.y <= curYear).sort((a, b) => b.y - a.y);
  for (const ev of merges){
    const before = ownerAt(ev.y - 1);
    const after = ownerAt(ev.y);
    const aliveBefore = new Set(Object.values(before).filter(v => v !== 'none'));
    const aliveAfter = new Set(Object.values(after).filter(v => v !== 'none'));
    const victims = [...aliveBefore].filter(k => !aliveAfter.has(k) && S[k] && k !== 'none');
    for (const victim of victims){
      const gainer = {};
      for (const r of REGIONS){
        if (before[r.k] !== after[r.k] && before[r.k] === victim) gainer[victim] = after[r.k];
      }
      const conq = gainer[victim];
      if (!conq || conq === 'none') continue;
      const merged = REGIONS.filter(r => before[r.k] === victim && after[r.k] === conq).length;
      showDossier(conq, victim, ev.y, ev.s, { merged });
      return true;
    }
  }
  return false;
}

/* 逐事件精确判定：某国在该事件中失去最后一块领土，则浮出「X 灭 Y」字幕 */
function detectAnnexations(fromYear, toYear){
  if (fromYear === null || fromYear === undefined) return false;
  // 仅在向前推进时判定，且只看目标年份本身的事件
  if (toYear <= fromYear) return false;

  const crossed = EVENTS.filter(e => e.y === toYear && e.ch);
  if (!crossed.length) return false;

  let shown = 0;
  for (const ev of crossed.slice(-3)){
    const before = ownerAt(ev.y - 1);
    const after = ownerAt(ev.y);
    const aliveBefore = new Set(Object.values(before).filter(v => v !== 'none'));
    const aliveAfter = new Set(Object.values(after).filter(v => v !== 'none'));
    const victims = [...aliveBefore].filter(k => !aliveAfter.has(k) && S[k] && k !== 'none');
    if (!victims.length) continue;

    // 接收者集合：一家独吞为单个键，多家瓜分为数组
    const gainers = {};
    for (const r of REGIONS){
      if (before[r.k] !== after[r.k] && victims.includes(before[r.k])){
        const to = after[r.k];
        if (!to || to === 'none') continue;
        (gainers[before[r.k]] = gainers[before[r.k]] || []).push(to);
      }
    }
    for (const victim of victims){
      const list = [...new Set(gainers[victim] || [])];
      if (!list.length) continue;
      // 按得地多少降序：得地最多者居首，读起来更符合主次
      const gcount = {};
      for (const k of list) gcount[k] = REGIONS.filter(r => before[r.k] === victim && after[r.k] === k).length;
      list.sort((a, b) => (gcount[b] || 0) - (gcount[a] || 0));
      const conq = list.length > 1 ? list : list[0];
      showAnnexBanner(conq, victim, ev.y, ev.s);
      // 并入的区数（用于档案卡片量化展示）
      const merged = REGIONS.filter(r => before[r.k] === victim && list.includes(after[r.k])).length;
      showDossier(conq, victim, ev.y, ev.s, { merged });
      shown++;
      if (shown >= 2) return true;
    }
  }
  return shown > 0;
}

function updateBattles(year){
  // 标记数量很少，每年重建，逻辑更简单可靠
  while (gBattles.firstChild) gBattles.removeChild(gBattles.firstChild);

    const [x, y] = px(b.lon, b.lat);
    const g = document.createElementNS(NS,'g');
    g.setAttribute('opacity', '0');

    if (b.kind === 'battle'){
      const sword = document.createElementNS(NS,'text');
      sword.setAttribute('x', x.toFixed(1));
      sword.setAttribute('y', y.toFixed(1));
      sword.setAttribute('text-anchor','middle');
      sword.setAttribute('dominant-baseline','central');
      sword.setAttribute('font-size','13');
      sword.setAttribute('fill','#f0d060');
      sword.textContent = '⚔';
      g.appendChild(sword);
    }
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', x.toFixed(1));
    t.setAttribute('y', (y + 12).toFixed(1));
    t.setAttribute('text-anchor','middle');

    t.textContent = b.n;
    g.appendChild(t);

    gBattles.appendChild(g);
    requestAnimationFrame(()=> g.setAttribute('opacity','1'));
  }
}

  // 事件列表：最近若干条 + 当前年触发

    if (e.y === year) cls.push('new');
    return `<div class="${cls.join(' ')}"><time>前${-e.y}</time><p>${e.s}</p></div>`;
  }).join('') : '<div class="empty">尚未发生任何大事。</div>';
}

/* ---------- 播放控制 ---------- */
const MIN_Y = -770, MAX_Y = -221;
let playing = false, speed = 1, rafId = null, lastTs = 0;
let yearFloat = MIN_Y;

function setYear(y, opts){
  yearFloat = Math.min(MAX_Y, Math.max(MIN_Y, y));
  $('slider').value = Math.round(yearFloat);
  render(Math.round(yearFloat), opts);
  // 年份变化后取消高亮，避免压暗其他领土干扰对比
  if (selectedOwner){ selectedOwner = null; }
}

function togglePlay(){
  playing = !playing;
  $('btnPlay').textContent = playing ? '暂停' : '播放';
  if (playing){
    if (yearFloat >= MAX_Y) yearFloat = MIN_Y;
    lastTs = 0;
    rafId = requestAnimationFrame(tick);
  } else if (rafId){
    cancelAnimationFrame(rafId); rafId = null;
  }
}

const BASE_RATE = 3.4; // 每秒推进的年数（1×）
const HOLD_MS = 760;   // 到达兼并年份后的自动停顿

let holdUntil = 0;
let lastRendered = null;

function tick(ts){
  if (!playing) return;
  if (!lastTs){ lastTs = ts; rafId = requestAnimationFrame(tick); return; }
  const dt = Math.min(0.07, (ts - lastTs) / 1000);
  lastTs = ts;

  // 兼并年份停顿：让征服潮与灭国字幕被看见
  if (ts < holdUntil){ rafId = requestAnimationFrame(tick); return; }

  yearFloat += dt * BASE_RATE * speed;
  if (yearFloat >= MAX_Y){
    yearFloat = MAX_Y;
    $('slider').value = MAX_Y;
    render(MAX_Y);
    playing = false;
    $('btnPlay').textContent = '播放';
    return;
  }
  const shown = Math.round(yearFloat);

  // 跨过一个兼并事件时停一下
  if (shown !== lastRendered){
    lastRendered = shown;
    const hit = EVENTS.some(e => e.y === shown && e.t === 'merge' && e.ch);
    if (hit) holdUntil = ts + HOLD_MS;
    $('slider').value = shown;
    render(shown, { silent:true });
  }
  rafId = requestAnimationFrame(tick);
}

function jumpEvent(dir){
  const y = curYear;
  const list = EVENTS.map(e=>e.y);
  if (dir > 0){
    const n = list.find(v => v > y);
    if (n !== undefined) { setYear(n); }
  } else {
    const p = [...list].reverse().find(v => v < y);
    if (p !== undefined) { setYear(p); }
  }
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  const dossierBox = $('dossier');
  const dossierOpen = dossierBox && dossierBox.classList.contains('on');

  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape'){
    if (dossierOpen){ e.preventDefault(); clearDossier(); }
  }
  else if (e.key === 'd' || e.key === 'D'){
    // 重新打开最近一次兼并档案
    if (reopenDossier()) e.preventDefault();
  }
  else if (e.key === 'Enter'){
    if (dossierOpen){
      const t = $('dsToggle');
      if (t){ e.preventDefault(); t.click(); }
    }
  }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); setYear(curYear + (e.shiftKey ? 20 : 5)); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); setYear(curYear - (e.shiftKey ? 20 : 5)); }
  else if (e.key === 'Home'){ e.preventDefault(); setYear(MIN_Y); }
  else if (e.key === 'End'){ e.preventDefault(); setYear(MAX_Y); }
});

/* ---------- 时间轴：兼并事件刻度 ---------- */
const evtMarkEls = [];

(function buildEventMarks(){
  const box = $('evtmarks');
  const span = MAX_Y - MIN_Y;
  const merges = EVENTS.filter(e => e.t === 'merge' && e.ch);
  box.innerHTML = merges.map(e => {
    const p = (e.y - MIN_Y) / span * 100;
    return `<i data-y="${e.y}" style="left:${p.toFixed(2)}%" title="前${-e.y}年 领土变更"></i>`;
  }).join('');
  [...box.children].forEach(el => evtMarkEls.push(el));
})();

function highlightEventMarks(year){
  for (const el of evtMarkEls){
    el.classList.toggle('hit', Number(el.dataset.y) === year);
  }
}
(function buildTicks(){
  const box = $('ticks');
  const span = MAX_Y - MIN_Y;
  const marks = [
    { y:-770, t:'前770' },
    { y:-700, t:'前700' },
    { y:-600, t:'前600' },
    { y:-500, t:'前500' },
    { y:-403, t:'前403', era:'w' },
    { y:-300, t:'前300' },
    { y:-221, t:'前221' }
  ];
  box.innerHTML = marks.map(m=>{
    const p = (m.y - MIN_Y) / span * 100;
    const cls = m.era === 'w' ? 'era-w' : '';
    return `<span class="${cls}" style="left:${p.toFixed(2)}%">${m.t}</span>`;
  }).join('');
})();

/* ---------- 悬停提示 ---------- */
const tip = $('tip'), wrap = $('mapwrap');
gRegions.addEventListener('mousemove', e=>{
  const el = e.target.closest('.region');
  if (!el){ tip.classList.remove('on'); return; }
  const k = el.dataset.k;
  const own = ownerAt(curYear);
  const o = own[k];
  const region = REGIONS.find(r=>r.k===k);
  const sp = S[o] || S.none;
  const fate = o === 'none' ? '此时尚未归属任何诸侯'
    : (k !== o ? `此地此时属 <b style="color:${sp.c}">${sp.n}</b>` : `本地为 <b style="color:${sp.c}">${sp.n}</b> 核心区`);
  tip.innerHTML = `<h4><i style="background:${sp.c}"></i>${region.n}</h4>
    <div class="row">归属：<b style="color:${sp.c}">${sp.n}</b></div>
    <div class="fate">${fate}</div>`;
  tip.classList.add('on');
  const rect = wrap.getBoundingClientRect();
  let x = e.clientX - rect.left + 16, y = e.clientY - rect.top + 12;
  if (x + 230 > rect.width) x = e.clientX - rect.left - 236;
  if (y + 120 > rect.height) y = e.clientY - rect.top - 108;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});
gRegions.addEventListener('mouseleave', ()=>tip.classList.remove('on'));

/* ---------- 初始化 ---------- */
(function init(){
  setYear(MIN_Y);
})();
</script>
</body>
</html>
