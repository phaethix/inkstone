[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstone"
version = "0.1.0"
description = "Local-first, open-source novel-to-comic generator built on the free Agnes multimodal API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inkstone contributors" }]
keywords = ["comic", "manga", "ai", "agnes", "image-generation", "novel"]
dependencies = [
    "requests>=2.28.0,<3.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "numpy>=1.24.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/phaethix/inkstone"
Repository = "https://github.com/phaethix/inkstone"
"Bug Tracker" = "https://github.com/phaethix/inkstone/issues"

[tool.setuptools]
packages = ["core", "core.api", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["core", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
