[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstone"
version = "0.1.0"
description = "Local-first, open-source novel-to-comic generator built on the free Agnes multimodal API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inkstone contributors" }]
keywords = ["comic", "manga", "ai", "agnes", "image-generation", "novel"]
dependencies = [
    "requests>=2.34.2,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[project.urls]
Homepage = "https://github.com/phaethix/inkstone"
Repository = "https://github.com/phaethix/inkstone"
"Bug Tracker" = "https://github.com/phaethix/inkstone/issues"

[tool.setuptools]
packages = ["core", "core.api", "core.comic", "core.pipelines", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["core", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
