<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Inkstone pipeline — novel to comic</title>
  <desc id="desc">Five-stage pipeline: split the novel, extract characters and scenes, generate storyboard prompts, paint panels with the image provider, and lay out then export to PDF or PNG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCFAF5"/>
      <stop offset="1" stop-color="#F5F1E9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- Header -->
    <text x="54" y="50" fill="#8A8594" font-size="14" font-weight="720" letter-spacing="2.4">
      FROM NOVEL TO COMIC PAGES
    </text>

    <!-- Dashed connecting arc -->
    <path d="M110 225C230 160 350 255 500 190S720 240 860 175s180 12 212 36" fill="none" stroke="#3A6B6B" stroke-opacity=".28" stroke-width="3.5" stroke-dasharray="8 10"/>

    <!-- Step 1 — SPLIT (dark) -->
    <g transform="translate(64, 152)">
      <circle cx="48" cy="48" r="48" fill="#1B212C"/>
      <text x="48" y="42" text-anchor="middle" fill="#63D3BE" font-size="13" font-weight="760">01</text>
      <text x="48" y="64" text-anchor="middle" fill="#F0ECE4" font-size="18" font-weight="720">SPLIT</text>
    </g>

    <!-- Step 2 — EXTRACT (teal) -->
    <g transform="translate(264, 130)">
      <circle cx="48" cy="48" r="48" fill="#3A6B6B"/>
      <text x="48" y="42" text-anchor="middle" fill="#D4F0E8" font-size="13" font-weight="760">02</text>
      <text x="48" y="64" text-anchor="middle" fill="#D4F0E8" font-size="18" font-weight="720">EXTRACT</text>
    </g>

    <!-- Step 3 — BOARD (vermilion) -->
    <g transform="translate(474, 172)">
      <circle cx="48" cy="48" r="48" fill="#C0412B"/>
      <text x="48" y="42" text-anchor="middle" fill="#FCE4DC" font-size="13" font-weight="760">03</text>
      <text x="48" y="64" text-anchor="middle" fill="#FCE4DC" font-size="15" font-weight="720">BOARD</text>
    </g>

    <!-- Step 4 — PAINT (dark) -->
    <g transform="translate(684, 138)">
      <circle cx="48" cy="48" r="48" fill="#1B212C"/>
      <text x="48" y="42" text-anchor="middle" fill="#63D3BE" font-size="13" font-weight="760">04</text>
      <text x="48" y="64" text-anchor="middle" fill="#F0ECE4" font-size="18" font-weight="720">PAINT</text>
    </g>

    <!-- Step 5 — EXPORT (outlined) -->
    <g transform="translate(894, 160)">
      <circle cx="48" cy="48" r="48" fill="#FCFAF5" stroke="#C0412B" stroke-width="2.5"/>
      <text x="48" y="42" text-anchor="middle" fill="#C0412B" font-size="13" font-weight="760">05</text>
      <text x="48" y="64" text-anchor="middle" fill="#1B212C" font-size="17" font-weight="720">EXPORT</text>
    </g>
  </g>
</svg>
