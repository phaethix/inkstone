<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inkstone — novel → comic</title>
  <style>
    :root {
      --bg: #020617; --card: #0f172a; --card2: #111827; --border: #1e293b;
      --line: #334155; --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
      --indigo: #4f46e5; --indigo-h: #6366f1; --indigo-bg: #312e81;
      --emerald-bg: #064e3b; --emerald: #6ee7b7;
      --red-bg: #450a0a; --red: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); padding: 3px; }
    .brand h1 { font-size: 20px; font-weight: 700; margin: 0; }
    .brand p { font-size: 12px; color: var(--muted); margin: 0; }
    .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--card); color: var(--muted); }
    .badge.live { background: var(--emerald-bg); color: var(--emerald); }
    .badge.demo { background: var(--indigo-bg); color: #c7d2fe; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%; min-height: 200px; resize: vertical; background: var(--bg);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      color: var(--text); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    textarea:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 2px rgba(79,70,229,.4); }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    select { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font-size: 14px; }
    button {
      margin-left: auto; background: var(--indigo); color: #fff; font-weight: 600;
      border: none; border-radius: 12px; padding: 10px 20px; font-size: 14px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--indigo-h); }
    button:disabled { opacity: .5; cursor: default; }
    .hint { font-size: 12px; color: var(--faint); margin-top: 8px; }
    .banner { background: rgba(49,46,129,.35); border: 1px solid var(--indigo-bg); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: #c7d2fe; margin-bottom: 20px; }
    .banner code { background: rgba(49,46,129,.6); padding: 1px 5px; border-radius: 5px; }
    .progress { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--indigo-h); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 12px; color: var(--muted); height: 176px; overflow: auto; white-space: pre-wrap; margin: 0; }
    .err { background: var(--red-bg); border: 1px solid #7f1d1d; border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--red); }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .grid img, .webtoon { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: block; }
    .webtoon { margin-bottom: 24px; }
    a.link { color: #a5b4fc; text-decoration: underline; font-size: 14px; }
    .hidden { display: none !important; }
    footer { font-size: 12px; color: var(--faint); margin-top: 48px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <img src="assets/logo.svg" alt="Inkstone" />
        <div>
          <h1>Inkstone</h1>
          <p>novel → comic · free Agnes API</p>
        </div>
      </div>
      <span id="mode" class="badge">…</span>
    </header>

    <section class="card">
      <label for="text">你的小说</label>
      <textarea id="text" placeholder="第一章 渡口&#10;&#10;江风裹着初秋的凉意……"></textarea>
      <div class="row">
        <select id="format">
          <option value="webtoon">条漫 (webtoon PNG)</option>
          <option value="page">页漫 (PDF)</option>
        </select>
        <button id="go">生成</button>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <div id="demoBanner" class="banner hidden">
      演示模式 · 下方展示一次真实生成的效果。在本地运行 <code>python web/server.py</code> 即可生成你自己的漫画。
    </div>

    <section id="progressWrap" class="hidden">
      <div class="progress"><span class="dot"></span><span id="status">生成中…</span></div>
      <pre id="log"></pre>
    </section>

    <section id="errorWrap" class="err hidden"></section>

    <section id="results" class="hidden">
      <h2>分镜</h2>
      <div id="panels" class="grid"></div>

      <div id="webtoonWrap" class="hidden">
        <h2>条漫全图</h2>
        <img id="webtoon" class="webtoon" alt="webtoon" />
      </div>

      <div id="pdfWrap" class="hidden">
        <a id="pdf" class="link" href="#" target="_blank" rel="noreferrer">下载 PDF</a>
      </div>
    </section>

    <footer>免费 Agnes API · 无需 GPU · 一致性来自 L1 提示词 + L2 参考图。可选的 L3 人脸叠加默认关闭。</footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // Pre-generated samples shown on GitHub Pages (demo mode) — the "effect".
    const DEMO = {
      panels: [
        { id: "P01", url: "assets/samples/P01.png" },
        { id: "P02", url: "assets/samples/P02.png" },
        { id: "P03", url: "assets/samples/P03.png" },
      ],
      webtoon: "assets/samples/webtoon_preview.png",
      pdf: null,
    };

    const DEMO_STEPS = ["分段文本", "抽取角色 / 场景", "规划分镜", "生成分镜图", "排版合成", "导出"];

    let mode = "demo";
    let pollTimer = null;

    async function detectMode() {
      try {
        const r = await fetch("/api/health");
        if (r.ok) {
          mode = "live";
          const el = $("mode");
          el.textContent = "本地 · Live";
          el.className = "badge live";
          return;
        }
      } catch (e) { /* no backend -> demo */ }
      mode = "demo";
      const el = $("mode");
      el.textContent = "演示 · Demo";
      el.className = "badge demo";
      $("demoBanner").classList.remove("hidden");
      render(DEMO); // show the effect immediately on the static site
    }

    function generate() {
      const text = $("text").value.trim();
      if (mode === "live" && !text) { setHint("先粘贴一些小说文本。"); return; }

      $("go").disabled = true;
      $("errorWrap").classList.add("hidden");
      $("results").classList.add("hidden");
      $("progressWrap").classList.remove("hidden");
      $("log").textContent = "";

      if (mode === "demo") return demoRun();
      liveRun(text, $("format").value);
    }

    // Demo: simulate the same step streaming, then reveal the baked samples.
    function demoRun() {
      let i = 0;
      setStatus("生成中…");
      const t = setInterval(() => {
        logLine("✓ " + DEMO_STEPS[i]);
        i++;
        if (i >= DEMO_STEPS.length) {
          clearInterval(t);
          setStatus("完成");
          $("progressWrap").classList.add("hidden");
          render(DEMO);
          $("go").disabled = false;
        }
      }, 350);
    }

    async function liveRun(text, format) {
      setStatus("提交任务…");
      let res;
      try {
        res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, format }),
        });
      } catch (e) { return fail("网络错误: " + e.message); }
      const data = await res.json();
      if (!res.ok) return fail(data.error || ("HTTP " + res.status));
      poll(data.job_id);
    }

    function poll(jobId) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        let job;
        try { job = await (await fetch("/api/job/" + jobId)).json(); }
        catch (e) { return; }
        $("log").textContent = job.log.join("\n");
        $("log").scrollTop = $("log").scrollHeight;
        if (job.status === "running") { setStatus("生成中…"); return; }
        clearInterval(pollTimer);
        if (job.status === "error") return fail(job.error || "生成失败");
        setStatus("完成");
        $("progressWrap").classList.add("hidden");
        render(job);
      }, 2000);
    }

    function render(job) {
      $("results").classList.remove("hidden");
      const grid = $("panels");
      grid.innerHTML = "";
      (job.panels || []).forEach((p) => {
        const img = document.createElement("img");
        img.src = p.url; img.alt = p.id;
        grid.appendChild(img);
      });
      if (job.webtoon) { $("webtoon").src = job.webtoon; $("webtoonWrap").classList.remove("hidden"); }
      if (job.pdf) { $("pdf").href = job.pdf; $("pdfWrap").classList.remove("hidden"); }
      $("go").disabled = false;
      $("results").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function fail(msg) {
      clearInterval(pollTimer);
      $("go").disabled = false;
      setStatus("错误");
      const e = $("errorWrap");
      e.textContent = msg;
      e.classList.remove("hidden");
    }

    const setStatus = (s) => ($("status").textContent = s);
    const setHint = (s) => ($("hint").textContent = s);
    const logLine = (s) => { $("log").textContent += s + "\n"; $("log").scrollTop = $("log").scrollHeight; };

    $("go").addEventListener("click", generate);
    detectMode();
  </script>
</body>
</html>
